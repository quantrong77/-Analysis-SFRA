      open: { r1: changed, r3: unchanged }
      short: { r1: unchanged, r3: unchanged }
      features: [{ id: lf_rise, required: false }]
    suggest: [corroborate]
  - id: contact
    label: "Điện trở tiếp xúc cao"
    source: "IEEE Std C57.149-2012, 6.5.5, Bảng 11"
    summary: "Mặt tiếp xúc kim loại nối sứ với cuộn dây, bộ điều áp bị lỏng, ăn mòn, bám bẩn hoặc cháy."
    regions:
      - range: "20 Hz – 10 kHz"
        text: "Hở mạch: thường không ảnh hưởng. Ngắn mạch: không khớp với lần trước hoặc giữa các pha, đường của cuộn hư hỏng thường lệch."
      - range: "5 – 100 kHz"
        text: "Có thể dịch hoặc tạo đỉnh, hố mới; pha hư hỏng thay đổi nhiều hơn."
      - range: "50 kHz – 1 MHz"
        text: "Có thể dịch hoặc tạo đỉnh, hố mới; pha hư hỏng thay đổi nhiều hơn."
      - range: "Trên 1 MHz"
        text: "Có thể dịch hoặc tạo đỉnh, hố mới; pha hư hỏng thay đổi nhiều hơn."
    bands: [r1, r2, r3, r4]
