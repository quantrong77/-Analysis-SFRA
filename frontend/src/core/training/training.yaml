        text: "Hở mạch: ảnh hưởng của từ trở lõi mất đi, đường hở mạch giống đường ngắn mạch; cuộn hư hỏng thay đổi nhiều nhất, các cuộn khác cũng đổi nhưng ít hơn. Ngắn mạch: không khớp với lần trước hoặc giữa các pha, cuộn hư hỏng thường lệch."
      - range: "5 – 100 kHz"
        text: "Có thể dịch hoặc tạo đỉnh, hố mới; pha hư hỏng thay đổi nhiều hơn."
      - range: "50 kHz – 1 MHz"
        text: "Có thể dịch hoặc tạo đỉnh, hố mới; pha hư hỏng thay đổi nhiều hơn."
      - range: "Trên 1 MHz"
        text: "Có thể dịch hoặc tạo đỉnh, hố mới; pha hư hỏng thay đổi nhiều hơn."
