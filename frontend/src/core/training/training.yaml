  - id: open_winding
    label: "Hở mạch cuộn dây"
    source: "IEEE Std C57.149-2012, 6.5.7, Bảng 13"
    summary: "Mối nối bung ra hoặc cuộn dây cháy đứt; trở kháng rất lớn chen vào mạch đo, đáp ứng thường tụt trên dải rộng, hở hoàn toàn thì chìm vào nhiễu nền."
    regions:
      - range: "20 Hz – 10 kHz"
        text: "Hở mạch: hình dạng cộng hưởng lõi chính thay đổi. Ngắn mạch: không khớp với lần trước hoặc giữa các pha, cuộn hư hỏng thường lệch."
      - range: "5 – 100 kHz"
        text: "Rõ nhất ở dải này; đỉnh hoặc hố mới nổi trội là dấu hiệu chính."
      - range: "50 kHz – 1 MHz"
        text: "Có thể dịch hoặc tạo đỉnh, hố mới; pha hư hỏng thay đổi nhiều hơn."
      - range: "Trên 1 MHz"
        text: "Có thể dịch hoặc tạo đỉnh, hố mới; pha hư hỏng thay đổi nhiều hơn."
    bands: [r1, r2]
