    source: "IEEE Std C57.149-2012, 6.5.6, Bảng 12"
    summary: "Chạm giữa hai vòng dây cạnh nhau hoặc giữa các pha, có thể chạm chết hoặc rò qua điện trở lớn; là một trong những dạng dễ nhận ra nhất."
    regions:
